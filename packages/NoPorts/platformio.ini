; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
  -DARDUINO_LOOP_STACK_SIZE=32768
lib_extra_dirs =
  ../../lib
lib_deps =
  ; TEST ONLY - do not merge: at_client pinned to the at_client_arduino#10
  ; branch until 0.2.0 is published to the PlatformIO registry
  https://github.com/atsign-foundation/at_client_arduino.git#fix/rsa-encrypt-output-bound
  NoPorts
