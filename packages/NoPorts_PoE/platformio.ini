; NoPorts PoE — headless NoPorts daemon for M5Stack Unit PoE (ESP32-P4)
; Web-based setup UI served over Ethernet (PoE).
;
; Build targets:
;
;   PRODUCTION (M5Stack Unit PoE-P4 hardware)
;     pioarduino = community fork of espressif32 that tracks arduino-esp32
;     3.3.x with ESP32-P4 / RISC-V toolchain support.
;     pio run -e esp32p4 --target upload
;
;   STOCK ESP32 over WiFi (any ESP32 / ESP32-S3 dev board, joins your LAN)
;     NOPORTS_WIFI_SSID=MyNet NOPORTS_WIFI_PASS=secret \
;       pio run -e esp32_wifi --target upload
;     Same web UI + enrol flow as production, reachable at http://noports-poe.local
;
;   TEST (any ESP32-S3 dev board) → use PlatformIO
;     pio run -e test_esp32s3 --target upload
;     pio device monitor
;     python test/test_http.py   (connect to NoPorts-Test AP first)

[platformio]
default_envs = esp32p4

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
build_flags =
  -DARDUINO_LOOP_STACK_SIZE=32768
  -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
lib_extra_dirs =
  ../../lib
lib_deps =
  atsign/at_client@^1.0.0
  NoPorts

; ─────────────────────────────────────────────────────────────
; Production: M5Stack Unit PoE-P4
;   pioarduino = community fork of espressif32 that tracks arduino-esp32
;   3.3.x (includes ESP32-P4 support, unlike official PlatformIO platform).
;   https://github.com/pioarduino/platform-espressif32
; ─────────────────────────────────────────────────────────────
[env:esp32p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-p4-evboard
board_build.partitions = partitions_16mb.csv
extra_scripts = extra_scripts.py
build_flags =
  ${env.build_flags}
  -DNOPORTS_POE_P4

; ─────────────────────────────────────────────────────────────
; Stock ESP32 over WiFi (station mode)
;   Any off-the-shelf ESP32 dev board (WROOM-32, 4 MB flash, no PSRAM) or
;   ESP32-S3.  Joins your WiFi network as a client so the device has a real
;   internet route: setup + OTP enrolment + the daemon all work, exactly as on
;   the PoE-P4, just over WiFi instead of Ethernet.
;
;   Credentials come from the shell environment at build time so they never
;   land in git:
;     NOPORTS_WIFI_SSID=MyNet NOPORTS_WIFI_PASS=secret pio run -e esp32_wifi -t upload
;   (a proper on-device WiFi provisioning page is the planned follow-up)
; ─────────────────────────────────────────────────────────────
[env:esp32_wifi]
platform = espressif32
board = esp32dev
board_build.partitions = default.csv
build_flags =
  ${env.build_flags}
  -DNOPORTS_WIFI_STA
  '-DWIFI_STA_SSID="${sysenv.NOPORTS_WIFI_SSID}"'
  '-DWIFI_STA_PASS="${sysenv.NOPORTS_WIFI_PASS}"'

; ─────────────────────────────────────────────────────────────
; Stock ESP32 over WiFi — TUNED framework build   *** EXPERIMENTAL ***
;   Same firmware as esp32_wifi, but built on pioarduino (arduino-esp32 3.x)
;   with the IDF libraries recompiled from sdkconfig.noports:
;     - lwIP 2 x MSS send/recv per socket (default 4 x) — WORKS
;     - shorter TIME_WAIT so PCB slots recycle          — WORKS
;     - mbedTLS dynamic buffers                          — DOES NOT (see
;       sdkconfig.noports: pioarduino never refreshes the nested mbedTLS
;       archives; enabling it boot-loops at the first TLS handshake)
;   Without the mbedTLS part the 3.x core's ~33 KB higher DRAM baseline
;   roughly cancels the lwIP savings, so esp32_wifi remains the recommended
;   stock-ESP32 target.  Kept so the work is reproducible when pioarduino
;   fixes the copy (or someone wires a post-build copy of the nested libs).
;   The prebuilt framework used by esp32_wifi silently ignores that file.
;   First build compiles ESP-IDF and takes a long time; later builds are
;   cached until sdkconfig.noports changes.  pioarduino writes its OWN generated
;   state into sdkconfig.defaults / sdkconfig.<env> / CMakeLists.txt /
;   managed_components — all git-ignored; never point custom_sdkconfig at
;   sdkconfig.defaults or the build loops forever.
;   partitions_4mb.csv: single 2.5 MB app slot (3.x core is larger), LittleFS kept
;   at the default.csv offset so enrolled keys survive switching envs.
;   NOTE: pioarduino keeps ONE copy of the framework libs, so alternating
;   between this env and esp32p4 triggers a lib reinstall each time.
; ─────────────────────────────────────────────────────────────
[env:esp32_wifi_tuned]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
board_build.partitions = partitions_4mb.csv
custom_sdkconfig = file://sdkconfig.noports
; IDF managed components this firmware never uses.  esp-modbus fails its own
; Kconfig static assert in this build mode; the rest only add compile time
; and flash.  Kept: mdns, littlefs, cjson, ethernet PHYs.
custom_component_remove =
  espressif/esp-modbus
  espressif/esp-dsp
  espressif/esp-sr
  espressif/esp_rainmaker
  espressif/rmaker_common
  espressif/esp_insights
  espressif/esp_diagnostics
  espressif/esp_diag_data_store
  espressif/esp-zboss-lib
  espressif/esp-zigbee-lib
  espressif/network_provisioning
  espressif/qrcode
  espressif/esp_hosted
  espressif/esp_wifi_remote
  espressif/esp_modem
  espressif/libsodium
  espressif/cbor
  chmorgan/esp-libhelix-mp3
build_flags =
  ${env.build_flags}
  -DNOPORTS_WIFI_STA
  '-DWIFI_STA_SSID="${sysenv.NOPORTS_WIFI_SSID}"'
  '-DWIFI_STA_PASS="${sysenv.NOPORTS_WIFI_PASS}"'

; ─────────────────────────────────────────────────────────────
; Test: ESP32-S3 dev board via WiFi AP  (PRIMARY TEST TARGET)
;   Flash to any ESP32-S3, connect to "NoPorts-Test" AP,
;   browse to 192.168.4.1, then run python test/test_http.py
; ─────────────────────────────────────────────────────────────
[env:test_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.partitions = default.csv
upload_port = /dev/cu.usbmodem*
build_flags =
  ${env.build_flags}
  -DNOPORTS_TEST_WIFI_AP
  -DTEST_WIFI_SSID=\"NoPorts-Test\"
  -DTEST_WIFI_PASS=\"noports123\"
  -DARDUINO_USB_CDC_ON_BOOT=1

; ─────────────────────────────────────────────────────────────
; Test: standard ESP32 dev board via WiFi AP
; ─────────────────────────────────────────────────────────────
[env:test_esp32]
platform = espressif32
board = esp32dev
board_build.partitions = default.csv
build_flags =
  ${env.build_flags}
  -DNOPORTS_TEST_WIFI_AP
  -DTEST_WIFI_SSID=\"NoPorts-Test\"
  -DTEST_WIFI_PASS=\"noports123\"
