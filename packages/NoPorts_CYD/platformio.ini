; PlatformIO Project Configuration File
; NoPorts_CYD - NoPorts daemon with CYD touchscreen UI
;
; Supports:
;   - CYD (ESP32-2432S028R) - single micro-USB
;   - CYD2USB (ESP32-2432S028Rv2) - micro-USB + USB-C
;
; Board definitions come from the boards/ submodule:
;   git submodule add https://github.com/rzeldent/platformio-espressif32-sunton.git boards

[platformio]
default_envs = cyd
boards_dir = boards

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

build_flags =
  -DARDUINO_LOOP_STACK_SIZE=32768
  -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
  ; LVGL configuration
  -D LV_CONF_SKIP
  -D LV_COLOR_DEPTH=16
  -D LV_MEM_SIZE=32768
  -D LV_MEM_ADR=0
  -D LV_DEF_REFR_PERIOD=33
  -D LV_DPI_DEF=130
  -D LV_USE_LOG=1
  -D LV_LOG_LEVEL=LV_LOG_LEVEL_WARN
  -D LV_LOG_PRINTF=1
  ; Fonts
  -D LV_FONT_MONTSERRAT_12=1
  -D LV_FONT_MONTSERRAT_14=1
  -D LV_FONT_MONTSERRAT_16=1
  -D LV_FONT_MONTSERRAT_20=1
  -D LV_FONT_DEFAULT="\\&lv_font_montserrat_14"
  ; Widgets
  -D LV_USE_BTN=1
  -D LV_USE_LABEL=1
  -D LV_USE_TEXTAREA=1
  -D LV_USE_KEYBOARD=1
  -D LV_USE_LIST=1
  -D LV_USE_TABVIEW=1
  -D LV_USE_SPINNER=1
  -D LV_USE_SWITCH=1
  -D LV_USE_LED=1
  -D LV_USE_TABLE=1
  -D LV_USE_MSGBOX=1
  -D LV_USE_DROPDOWN=1
  ; Layouts
  -D LV_USE_FLEX=1
  -D LV_USE_GRID=1
  ; Features
  -D LV_USE_OBSERVER=1
  -D LV_BUILD_EXAMPLES=0
  ; Only load ISRG Root X1 cert (~1.9KB) instead of all 7 CAs (~12KB) to save heap
  -D ATSDK_TLS_MINIMAL_CERTS

lib_extra_dirs =
  ../../lib

lib_deps =
  https://github.com/rzeldent/esp32-smartdisplay.git
  NoPorts

upload_speed = 460800

[env:cyd]
board = esp32-2432S028R

[env:cyd2usb]
board = esp32-2432S028Rv2
