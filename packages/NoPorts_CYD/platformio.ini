; PlatformIO Project Configuration File
; NoPorts_CYD - NoPorts daemon with CYD touchscreen UI
;
; Supports:
;   - CYD (ESP32-2432S028R) - single micro-USB
;   - CYD2USB (ESP32-2432S028Rv2) - micro-USB + USB-C
;
; Board definitions come from the boards/ submodule:
;   git submodule add https://github.com/rzeldent/platformio-espressif32-sunton.git boards

[platformio]
default_envs = cyd
boards_dir = boards

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

build_src_filter =
  +<*>
  -<old_lvgl/>

build_flags =
  -DARDUINO_LOOP_STACK_SIZE=32768
  -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
  ; TFT_eSPI configuration (memory-efficient alternative to LVGL)
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TOUCH_CS=33
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=16000000
  ; Load only the fonts we actually use (1=8px, 2=16px, 4=26px)
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  ; Only load ISRG Root X1 cert (~1.9KB) instead of all 7 CAs (~12KB) to save heap
  -D ATSDK_TLS_MINIMAL_CERTS
  ; TCP window/buffer sizes: 2×MSS = 2920 bytes per socket.
  ; 4×MSS still caused heap exhaustion with 3 active bulk sessions:
  ; 7 connections × (5840+5840) = 82KB max lwIP pbufs.
  ; 2×MSS: 7 × (2920+2920) = ~41KB, leaves ~60KB free floor for SDK allocs.
  -D CONFIG_TCP_WND_DEFAULT=2*1460
  -D CONFIG_TCP_SND_BUF_DEFAULT=2*1460
  -D CONFIG_TCP_RECVMBOX_SIZE=12
  -D CONFIG_LWIP_TCP_WND_DEFAULT=2*1460
  -D CONFIG_LWIP_TCP_SND_BUF_DEFAULT=2*1460
  -D CONFIG_LWIP_TCP_RECVMBOX_SIZE=12

lib_extra_dirs =
  ../../lib

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  thingpulse/ThingPulse XPT2046 Touch@^1.4
  NoPorts

upload_speed = 460800

[env:cyd]
board = esp32-2432S028R

[env:cyd2usb]
board = esp32-2432S028Rv2
