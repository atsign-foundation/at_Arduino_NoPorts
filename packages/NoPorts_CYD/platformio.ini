; PlatformIO Project Configuration File
; NoPorts_CYD - NoPorts daemon with CYD touchscreen UI
;
; Supports:
;   - CYD (ESP32-2432S028R) - single micro-USB
;   - CYD2USB (ESP32-2432S028Rv2) - micro-USB + USB-C
;
; Board definitions come from the boards/ submodule:
;   git submodule add https://github.com/rzeldent/platformio-espressif32-sunton.git boards

[platformio]
default_envs = cyd
boards_dir = boards

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

build_src_filter =
  +<*>
  -<old_lvgl/>

build_flags =
  -DARDUINO_LOOP_STACK_SIZE=32768
  -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
  ; TFT_eSPI configuration (memory-efficient alternative to LVGL)
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TOUCH_CS=33
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=16000000
  ; Load only the fonts we actually use (1=8px, 2=16px, 4=26px)
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  ; Only load ISRG Root X1 cert (~1.9KB) instead of all 7 CAs (~12KB) to save heap
  -D ATSDK_TLS_MINIMAL_CERTS
  ; lwIP TCP buffer sizing: balance throughput vs heap consumption.
  ; Each socket reserves 2× this for send+receive pbufs.
  ; With up to 7 relay sockets (ctrl+3×2): 7 × 2 × 2×1460 = ~41KB peak.
  ; 2×1460 caused heap exhaustion under 3 concurrent sessions: lwIP pbuf
  ; allocation drove heap to 10764, triggering ECONNABORTED on the control
  ; channel and dropping all relay traffic.  1×MSS per connection reduces the
  ; lwIP pbuf budget by ~19 KB across 7 PCBs, keeping steady-state heap well
  ; above HEAP_CRITICAL_LOW (12000) even under full-load three-session transfers.
  -D CONFIG_TCP_WND_DEFAULT=1460
  -D CONFIG_TCP_SND_BUF_DEFAULT=1460
  -D CONFIG_TCP_RECVMBOX_SIZE=12
  -D CONFIG_LWIP_TCP_WND_DEFAULT=1460
  -D CONFIG_LWIP_TCP_SND_BUF_DEFAULT=1460
  -D CONFIG_LWIP_TCP_RECVMBOX_SIZE=12
  ; TIME_WAIT duration: default 60 s, cut to 5 s so closed PCB slots are
  ; recycled quickly.  TIME_WAIT exists to absorb delayed duplicates;
  ; 5 s is safe on a LAN/relay topology where RTT <1 s.
  -D CONFIG_LWIP_TCP_MSL=5000

lib_extra_dirs =
  ../../lib

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  thingpulse/ThingPulse XPT2046 Touch@^1.4
  NoPorts

upload_speed = 460800

[env:cyd]
board = esp32-2432S028R

[env:cyd2usb]
board = esp32-2432S028Rv2

; Freenove ESP32-S3-WROOM variant (USB-C native USB, VID:PID=303A:1001)
; 240MHz, 16MB QIO flash, 8MB OPI PSRAM, 512KB SRAM
; The S3 exposes a built-in USB JTAG/CDC device on USB-C — no CH340 needed.
; Upload via: platformio run -e cyd2usb_s3 --target upload
[env:cyd2usb_s3]
board = esp32s3-2432S028R
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
upload_port = /dev/cu.usbmodem*
upload_speed = 460800
; FNK0104 has a WS2812B NeoPixel on GPIO 42 (not 3x discrete LEDs like the CYD)
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit NeoPixel@^1.12.0
; Override TFT_eSPI pin defines for Freenove FNK0104A/B (ESP32-S3 Display)
; Actual pins differ completely from the standard CYD (ESP32) used in [env]
build_flags =
  ${env.build_flags}
  -DESP32S3_2432S028R
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; FNK0104 display SPI pins (override common CYD pins)
  -DTFT_MISO=13
  -DTFT_MOSI=11
  -DTFT_SCLK=12
  -DTFT_CS=10
  -DTFT_DC=46
  -DTFT_RST=-1
  -DTFT_BL=45
  -DTFT_BACKLIGHT_ON=HIGH
  -DTFT_RGB_ORDER=1
  -DTFT_INVERSION_ON
  ; Touch: no XPT2046 on FNK0104; undefine to prevent conflicts
  -DTOUCH_CS=-1
  ; Backlight GPIO (CYD=21, FNK0104=45)
  -DDISPLAY_BCKL=45
